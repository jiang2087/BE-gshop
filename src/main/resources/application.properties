spring.application.name=demo
#spring.ai.google.genai.model=gemini-1.5-flash
#logging.level.org.springframework.security=DEBUG
#debug=true
spring.main.lazy-initialization=true
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
# data configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

#auto create / update schema
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

#jwt config (Ms)
hg.app.jwtSecret=${JWT_SECRET}
hg.app.jwtExpirationSecond=604800
hg.app.jwtRefreshable-duration=600

#ollama config
ollama.base-url=http://localhost:11434
ollama.embedding.model=nomic-embed-text
ollama.embedding.dimension=768
ollama.embedding.timeout-seconds=30

#Thread config
spring.threads.virtual.enabled=true

# Qdrant configuration (Docker default port)
qdrant.host=localhost
qdrant.port=6334
qdrant.collection-name=product_variants

# Qdrant search settings
qdrant.agrumentation.limit=8
qdrant.agrumentation.score-threshold=0.3
qdrant.agrumentation.max-context-chars=3500
qdrant.search.price-intent-score-threshold=0.4

#Logging
logging.charset.console=UTF-8
logging.charset.file=UTF-8

#spring ai
spring.ai.openai.api-key=sk_9router
spring.ai.openai.base-url=http://localhost:20128

# Chat Model Configuration
spring.ai.openai.chat.options.model=kc/openai/gpt-4.1
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=2000

# Disable audio features
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false



# Redis for chat memory
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# Chat memory settings
chat.memory.key-prefix=chat:memory:
chat.memory.max-turns=12
chat.memory.ttl=60m

# Redis Repositories Configuration
spring.data.redis.repositories.enabled=false

# JPA Repositories Configuration
spring.data.jpa.repositories.enabled=true
spring.data.jpa.repositories.base-package=com.example.demo.repository
